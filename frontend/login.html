<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Inkline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">Inkline<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-side">
    <div></div>
    <div>
      <p class="quote">"The first draft is just you telling yourself the story."</p>
      <p class="who">— every writer, eventually</p>
    </div>
  </div>

  <div class="auth-form">
    <div class="auth-card">
      <div class="eyebrow">Welcome back</div>
      <h1>Log in</h1>
      <p class="sub">Pick up where you left off.</p>

      <div class="form-err" id="err"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn block">Log in</button>
      </form>

      <p class="switch">New here? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errBox = document.getElementById('err');
    const btn = e.target.querySelector('button');
    errBox.classList.remove('show');

    btn.disabled = true;
    btn.textContent = 'Logging in...';

    try {
      await loginUser(email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
