<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — Inkline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">Inkline<span class="dot">.</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
    </div>
  </div>
</nav>

<div class="auth-shell">
  <div class="auth-side">
    <div></div>
    <div>
      <p class="quote">"Nobody is coming to organise your thoughts for you."</p>
      <p class="who">— start with one post</p>
    </div>
  </div>

  <div class="auth-form">
    <div class="auth-card">
      <div class="eyebrow">Get started</div>
      <h1>Create an account</h1>
      <p class="sub">Takes less time than the post itself will.</p>

      <div class="form-err" id="err"></div>

      <form id="register-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" required placeholder="Ada Verma">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="At least 6 characters">
          <div class="hint">Use at least 6 characters — this stays on your device for now.</div>
        </div>
        <button type="submit" class="btn block">Create account</button>
      </form>

      <p class="switch">Already have one? <a href="login.html">Log in</a></p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const errBox = document.getElementById('err');
    const btn = e.target.querySelector('button');
    errBox.classList.remove('show');

    if (password.length < 6){
      errBox.textContent = 'Password needs to be at least 6 characters.';
      errBox.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      await registerUser(name, email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
